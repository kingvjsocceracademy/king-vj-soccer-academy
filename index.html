<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING VJ SOCCER ACADEMY — Splash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#0c8a4d 0%,#064d2e 48%,#021f13 100%);color:#fff;z-index:9999;animation:screenFade 2s ease-in-out forwards}
.circle{width:min(78vw,420px);aspect-ratio:1;border:3px solid #ffffff70;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 12px #ffffff0c,0 0 55px #49e18b45;animation:circleIn .8s ease-out both}
.circle:before,.circle:after{content:"";position:absolute;border-radius:50%;inset:14px;border:1px dashed #ffffff45}
.circle:after{inset:-13px;border:1px solid #ffffff20}
.logo{width:82px;height:82px;object-fit:contain;position:absolute;top:18%;animation:logoPop .7s .2s both}
.words{text-align:center;padding:0 28px;margin-top:65px;font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1.18}
.words span{display:block;opacity:0;transform:translateY(18px);animation:wordIn .45s ease-out forwards}
.words span:nth-child(1){font-size:clamp(1.5rem,6vw,2.5rem);animation-delay:.25s;color:#fff}
.words span:nth-child(2){font-size:clamp(1.05rem,4vw,1.65rem);animation-delay:.55s;color:#f9d9d9}
.words span:nth-child(3){font-size:clamp(.85rem,3vw,1.25rem);letter-spacing:4px;animation-delay:.85s;color:#bff3d3}
.ball{position:absolute;bottom:17%;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 20px #ffffff80;animation:ballBounce .65s ease-in-out infinite alternate}
.ball:before{content:"";position:absolute;inset:6px;border:2px solid #087443;border-radius:50%}
@keyframes circleIn{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes logoPop{from{opacity:0;transform:scale(.5) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wordIn{to{opacity:1;transform:translateY(0)}}
@keyframes ballBounce{from{transform:translateY(0)}to{transform:translateY(-9px)}}
@keyframes screenFade{0%,82%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}
@media(prefers-reduced-motion:reduce){.splash,.circle,.logo,.words span,.ball{animation:none}.splash{opacity:0;visibility:hidden}}
</style>
</head>
<body>
<div class="splash" role="status" aria-label="KING VJ SOCCER ACADEMY loading">
  <div class="circle">
    <img class="logo" src="images/logo.png" alt="Academy logo">
    <div class="words"><span>KING VJ</span><span>SOCCER</span><span>ACADEMY</span></div>
    <div class="ball" aria-hidden="true"></div>
  </div>
</div>
<!-- Add this splash-screen markup and CSS to your site's pages, or use this file as a preview. -->
</body>
</html>
