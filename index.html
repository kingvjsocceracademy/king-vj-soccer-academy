
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING VJ Splash Screen</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #03140b;
    font-family: Arial, sans-serif;
    color: white;
}

.splash {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: fadeOut 0.5s ease 1.5s forwards;
}

.logo {
    font-size: 35px;
    font-weight: bold;
    color: #00ff88;
    animation: zoom 1s ease;
}

.ball {
    font-size: 65px;
    margin: 25px;
    animation: bounce 0.8s infinite alternate;
}

.tagline {
    letter-spacing: 4px;
    font-size: 13px;
    color: #aaa;
}

.loader {
    width: 160px;
    height: 4px;
    background: #153525;
    margin-top: 30px;
    overflow: hidden;
    border-radius: 10px;
}

.loader span {
    display: block;
    height: 100%;
    width: 0;
    background: #00ff88;
    animation: load 2s linear forwards;
}

@keyframes zoom {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes bounce {
    from { transform: translateY(-10px) rotate(-15deg); }
    to { transform: translateY(10px) rotate(15deg); }
}

@keyframes load {
    to { width: 100%; }
}

@keyframes fadeOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}
</style>
</head>

<body>

<div class="splash">
    <div class="logo">KING VJ</div>

    <div class="ball">⚽</div>

    <div class="tagline">SOCCER ACADEMY</div>

    <div class="loader">
        <span></span>
    </div>
</div>

<script>
setTimeout(() => {
    window.location.href = "index.html";
}, 2000);
</script>

</body>
</html>
